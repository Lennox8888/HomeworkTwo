<!DOCTYPE html>
<html>
  <head></head>
    <title>Homework 2</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
  <a-sky color=skyblue></a-sky>
      <a-plane
        rotation="-90 0 0"
        width="30"
        height="30"
        color=gray>
      </a-plane>

      <a-cylinder
        position="0 0 0"
        radius="0.08"
        height="6"
        color=gray>
      </a-cylinder>

      <a-box
        position="0 3.5 0"
        width="1.8"
        height="1"
        depth="0.08"
        color=white>
      </a-box>

      <a-box
        position="0 3.45 0.05"
        width="0.6"
        height="0.5"
        depth="0.01"
        color=red>
      </a-box>

      <a-cylinder
        position="0 3.1 0.38"
        radius="0.43"
        height=".05"
        rotation=" 0 0"
        color=red>
    </a-cylinder>
    <a-sphere
        position="0.7 .42 1"
        radius=".42"
        height="5"
        rotation=" 0 0"
        color=darkorange>  
    </a-sphere>
    <a-cone
    position="0 2.88 0.38"
        radius-top="0.13"
        radius-bottom="0.43"
        height="0.35"
        rotation="180 0 0"
        color=white>
    </a-cone>
    <a-entity position="0 1.6 5">
        <a-camera></a-camera>
      </a-entity>

    </a-scene>

</html>
